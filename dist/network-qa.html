<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network isolated QA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="catalog-v2-ui.css"><link rel="stylesheet" href="sheet-v2.css"><link rel="stylesheet" href="dossier.css"><link rel="stylesheet" href="dossier-v3.css"><link rel="stylesheet" href="inventory-v3.css"><link rel="stylesheet" href="chrome-ui.css"><link rel="stylesheet" href="network-ui.css"><body><div style="padding:6px;display:flex;gap:6px"><select id="qa-case" aria-label="Сценарий"><option value="3">MK3</option><option value="2">MK2</option><option value="4">MK4</option><option value="0">Нет нейродеки</option><option value="empty">Нет программ</option><option value="legacy">Старая карточка</option></select><select id="qa-role" aria-label="Роль"><option value="edit">Редактор</option><option value="view">Просмотр</option></select><button id="qa-reopen">Открыть сохранённый JSON</button></div><div id="app"></div><dialog id="dialog"></dialog><div id="toast"></div><script src="data.js"></script><script src="catalog-v2.js"></script><script src="engine.js"></script><script>window.ND_CLOUD={};let portalMaster=false,portalView='qa';function editPortrait(){}</script><script src="app.js"></script><script src="shop-ui.js"></script><script src="sheet-v2.js"></script><script src="dossier-v3.js"></script><script src="inventory-v3.js"></script><script src="chrome-ui.js"></script><script src="network-ui.js"></script><script>
D.catalog=window.ND_CATALOG_V2.normalizeCatalog(D.catalog);const NV=window.ND_CATALOG_V2;let qaSaved=null;changed=()=>{qaSaved=JSON.stringify(card);};status='Изолированная проверка · без записи в аккаунт';
function seed(value){card=E.blank(D);card.attributes=[2,1,1,0];card.hp=5;card.skills[6]=1;card.money=150;const level=['empty','legacy'].includes(value)?3:Number(value),deck=NV.all(D.catalog).find(x=>x.classId==='neurodeck'&&x.name.includes('МК'+level));if(deck){card=NV.addEquipment(card,D.catalog,deck.catalogId);card=NV.setEquipmentState(card,D.catalog,card.equipmentItems.at(-1).instanceId,'installed');}if(value!=='empty'){const list=NV.all(D.catalog),worms=list.filter(x=>x.classId==='worm').slice(0,level===4?3:2),demons=list.filter(x=>x.classId==='heavy_demon').slice(0,level===4?2:1);for(const item of [...worms,...demons]){card=NV.addEquipment(card,D.catalog,item.catalogId);if(deck)card=NV.setEquipmentState(card,D.catalog,card.equipmentItems.at(-1).instanceId,'loaded');}}if(value==='legacy'){delete card.equipmentVersion;delete card.equipmentItems;}tab='network';qaSaved=JSON.stringify(card);render();}
seed('3');document.querySelector('#qa-case').onchange=e=>seed(e.target.value);document.querySelector('#qa-role').onchange=e=>{canEdit=e.target.value==='edit';render();};document.querySelector('#qa-reopen').onclick=()=>{card=E.validate(JSON.parse(qaSaved),D);render();};</script></body></html>
