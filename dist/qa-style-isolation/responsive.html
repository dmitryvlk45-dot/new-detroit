<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Проверка изоляции стилей</title><style>body{margin:0;padding:12px;background:#191920;color:white;font:14px sans-serif}iframe{display:block;border:0;height:1200px}h1{font-size:16px}</style></head><body><h1 id="label"></h1><iframe title="Регрессионная проверка"></iframe><script>const p=new URLSearchParams(location.search),width=[360,390,430,768,1024,1440,1920].includes(Number(p.get('width')))?Number(p.get('width')):1440,stage=[0,1,2,3].includes(Number(p.get('stage')))?Number(p.get('stage')):0,section=['overview','inventory','chrome','network','notes','city-map'].includes(p.get('section'))?p.get('section'):'overview',id=p.get('character'),live=/^[a-f0-9-]{36}$/.test(id||'');document.querySelector('iframe').style.width=width+'px';document.querySelector('iframe').src=live?'/#/characters/'+id+'/'+section:'stage-'+stage;document.querySelector('#label').textContent=width+' px · '+(live?section:'стадия '+stage);</script></body></html>
