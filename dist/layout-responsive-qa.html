<!doctype html><meta charset="utf-8"><title>Character layout QA</title><style>body{margin:0;background:#0b0b10;color:white;font:14px sans-serif}header{padding:8px}select{padding:8px}iframe{display:block;width:1440px;height:1100px;border:0}</style><header><select id="qa-width" aria-label="Ширина"><option>1920</option><option selected>1440</option><option>1024</option><option>768</option><option>390</option><option>360</option></select></header><iframe title="Карточка персонажа"></iframe><script>const frame=document.querySelector("iframe"),select=document.querySelector("select"),width=new URLSearchParams(location.search).get("width");function size(w){frame.style.width=w+"px";frame.style.height=Number(w)<900?"844px":"1100px"}if(["1920","1440","1024","768","390","360"].includes(width)){select.value=width;size(width)}frame.src="./#/characters/local/overview";select.onchange=e=>size(e.target.value)</script>
