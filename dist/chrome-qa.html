<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome QA — isolated</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/catalog-v2-ui.css"><link rel="stylesheet" href="/sheet-v2.css"><link rel="stylesheet" href="/dossier.css"><link rel="stylesheet" href="/dossier-v3.css"><link rel="stylesheet" href="/inventory-v3.css"><link rel="stylesheet" href="/chrome-ui.css"><body><div style="padding:8px;display:flex;gap:8px"><select id="qa-case" aria-label="Сценарий"><option value="multiple">Разные зоны</option><option value="empty">Нет имплантов</option><option value="one">Один имплант</option><option value="head">Несколько в голове</option><option value="deck">Нейродека</option><option value="overload">Перегрузка</option></select><select id="qa-role" aria-label="Доступ"><option value="player">Игрок</option><option value="viewer">Просмотр</option></select><button id="qa-reopen">Повторно открыть JSON</button></div><div id="app"></div><dialog id="dialog"></dialog><div id="toast"></div><script src="/data.js"></script><script src="/catalog-v2.js"></script><script src="/engine.js"></script><script>window.ND_CLOUD={};let portalMaster=false,portalView='qa';function editPortrait(){}</script><script src="/app.js"></script><script src="/shop-ui.js"></script><script src="/sheet-v2.js"></script><script src="/dossier-v3.js"></script><script src="/inventory-v3.js"></script><script src="/chrome-ui.js"></script><script>
D.catalog=window.ND_CATALOG_V2.normalizeCatalog(D.catalog);
// Only the isolated fixture has precise sample placement, never saved or used by the live app.
D.catalog.implants.find(x=>x.name.includes('Locust')).equipment.placement='Руки / ноги';D.catalog.implants.find(x=>x.name.includes('PureAir')).equipment.placement='Торс';
function seed(which){card=E.blank(D);card.attributes=[2,1,1,0];card.hp=5;let names=({multiple:['TargetLink','Locust','PureAir'],empty:[],one:['TargetLink'],head:['TargetLink','Nightstalker'],deck:['МК2'],overload:['Locust','PureAir','TargetLink']})[which];for(const part of names){const item=window.ND_CATALOG_V2.all(D.catalog).find(x=>x.name.includes(part));card=window.ND_CATALOG_V2.addEquipment(card,D.catalog,item.catalogId);card=window.ND_CATALOG_V2.setEquipmentState(card,D.catalog,card.equipmentItems.at(-1).instanceId,'installed');}if(which==='overload'){card.attributes[0]=0;card.hp=3;}tab='chrome';render();}
changed=()=>{};status='Изолированная проверка · без сохранения в аккаунт';seed('multiple');document.querySelector('#qa-case').onchange=e=>seed(e.target.value);document.querySelector('#qa-role').onchange=e=>{canEdit=e.target.value==='player';render();};document.querySelector('#qa-reopen').onclick=()=>{card=E.validate(JSON.parse(JSON.stringify(card)),D);render();};</script></body></html>
